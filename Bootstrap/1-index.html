<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css"
        integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">
</head>

<body>
    <div class="container-fluid">
        <div class="row">
            <div class="col-12 col-lg-3 bg-primary text-white text-center mb-1 p-2">Primary</div>
            <div class="col-12 col-lg-3 bg-success text-white text-center mb-1 p-2">Success</div>
            <div class="col-12 col-lg-3 bg-danger text-white text-center mb-1 p-2">Danger</div>
            <div class="col-12 col-lg-3 bg-warning text-white text-center mb-1 p-2">Warning</div>

        </div>
        <div class="row">
            <div class="col-12 col-sm-3 bg-primary text-white text-center mb-1 p-2">Primary</div>
            <div class="col-12 col-sm-3 bg-success text-white text-center mb-1 p-2">Success</div>
            <div class="col-12 col-sm-3 bg-danger text-white text-center mb-1 p-2">Danger</div>
            <div class="col-12 col-sm-3 bg-warning text-white text-center mb-1 p-2">Warning</div>
        </div>
        <div class="row">
            <div class="col-12 col-lg-2 bg-primary text-white text-center mb-1 p-2">Primary</div>
            <div class="col-12 col-lg-4 bg-success text-white text-center mb-1 p-2">Success</div>
            <div class="col-12 col-lg-6 bg-danger text-white text-center mb-1 p-2">Danger</div>
        </div>

        <div class="row">
            <div
                class="col-12 col-md order-4 order-md-3 order-lg-2 order-xl-1 p-2 bg-primary text-white mb-1 text-center">
                Primary</div>
            <div
                class="col-12 col-md order-1 order-md-4 order-lg-3 order-xl-2 p-2 bg-success text-white mb-1  text-center">
                Success</div>
            <div
                class="col-12 col-md order-2 order-md-2 order-lg-1 order-xl-4 p-2 bg-danger text-white mb-1  text-center">
                Warning
            </div>
            <div
                class="col-12 col-md order-2 order-md-3 order-lg-1 order-xl-4 p-2 bg-warning text-dark  mb-1  text-center">
                Warning
            </div>

        </div>

        <div class="row align-item-center">
            <div class="col-12 col-md-2 bg-primary text-white text-center mb-1 p-2">Primary</div>
            <div class="col-12 col-md-2 offset-md-8 bg-success text-white text-center mb-1 p-2">Primary</div>
        </div>

        <div class="row align-item-center">
            <div class="col-12 col-md-2 bg-primary text-white text-center p-2">Primary</div>
            <div class="col-12 col-md-2 offset-md-4 bg-success text-white text-center p-2">Primary</div>
            <div class="col-12 col-md-2 offset-md-2 bg-danger text-white text-center p-2">Danger</div>
        </div>



    </div>
</body>

</html>
